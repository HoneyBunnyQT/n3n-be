  <text class="title" x="190" y="22" text-anchor="middle">TAP: the default</text>
  <rect class="box" x="50" y="36" width="280" height="40" rx="8"/>
  <text class="title" x="190" y="54" text-anchor="middle">the system</text>
  <text class="small" x="190" y="71" text-anchor="middle">applications, IP stack</text>
  <path class="wire" d="M 100 82 L 100 114"/>
  <polygon class="head" points="100.0,120.0 95.5,111.0 104.5,111.0"/>
  <polygon class="head" points="100.0,76.0 104.5,85.0 95.5,85.0"/>
  <text class="small" x="114" y="96" text-anchor="start">Ethernet frames: IPv4, IPv6,</text>
  <text class="small" x="114" y="110" text-anchor="start">ARP, any other protocol</text>
  <rect class="box" x="50" y="120" width="280" height="40" rx="8"/>
  <text class="title" x="190" y="145" text-anchor="middle">TAP device: n3n0</text>
  <path class="wire" d="M 100 166 L 100 198"/>
  <polygon class="head" points="100.0,204.0 95.5,195.0 104.5,195.0"/>
  <polygon class="head" points="100.0,160.0 104.5,169.0 95.5,169.0"/>
  <text class="small" x="114" y="186" text-anchor="start">the same</text>
