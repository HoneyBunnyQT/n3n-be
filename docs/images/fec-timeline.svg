  <text class="small" x="158" y="166" text-anchor="middle">group 1: frames 1-8, sent at once, as they are</text>
  <text class="small" x="158" y="180" text-anchor="middle">frames 3 and 6 lost on the way</text>
  <path class="wire" d="M 353.0 144 L 353.0 154"/>
  <path class="wire" d="M 455.0 144 L 455.0 154"/>
  <path class="wire" d="M 557.0 144 L 557.0 154"/>
  <path class="wire" d="M 353.0 154 L 557.0 154"/>
  <text class="small" x="455" y="170" text-anchor="middle">its 3 repairs, in PACKETs of their own,</text>
  <text class="small" x="455" y="184" text-anchor="middle">between group 2's frames (dashed)</text>
  <path class="relay" d="M 455.0 82 C 455.0 50, 107.0 50, 107.0 78"/>
  <polygon class="head" points="107.0,80.0 102.5,71.0 111.5,71.0"/>
  <path class="relay" d="M 455.0 82 C 455.0 50, 209.0 50, 209.0 78"/>
  <polygon class="head" points="209.0,80.0 204.5,71.0 213.5,71.0"/>
  <text class="small" x="478" y="60" text-anchor="start">frames 3 and 6 undone from the repairs -</text>
  <text class="small" x="478" y="74" text-anchor="start">any 3 of these 11 may get lost</text>
  <text class="small" x="20" y="212" text-anchor="start">Not right after the group: a burst of loss would take frames and repairs together.  Spread out, a few ms apart,</text>
  <text class="small" x="20" y="228" text-anchor="start">the repairs miss the burst - and the frames go at once: only a lost one waits for its repairs.</text>
  <text class="title" x="20" y="266" text-anchor="start">Voice: a frame each 20 ms - its repair rides along in the next PACKET</text>
  <rect class="box" x="24" y="290" width="58" height="34" rx="4"/>
  <text class="small" x="53" y="312" text-anchor="middle">frame 1</text>
  <text class="mono" x="53" y="340" text-anchor="middle">2</text>
  <rect class="box" x="196" y="290" width="58" height="34" rx="4"/>
  <text class="small" x="225" y="312" text-anchor="middle">frame 2</text>
  <rect class="hi" x="254" y="290" width="58" height="34" rx="4"/>
  <text class="small" x="283" y="312" text-anchor="middle">copy of 1</text>
  <text class="mono" x="254" y="340" text-anchor="middle">4</text>
  <rect class="box" x="368" y="290" width="58" height="34" rx="4"/>
  <text class="small" x="397" y="312" text-anchor="middle">frame 3</text>
  <rect class="hi" x="426" y="290" width="58" height="34" rx="4"/>
  <text class="small" x="455" y="312" text-anchor="middle">copy of 2</text>
  <text class="mono" x="426" y="340" text-anchor="middle">4</text>
  <rect class="box" x="540" y="290" width="58" height="34" rx="4"/>
  <text class="small" x="569" y="312" text-anchor="middle">frame 4</text>
  <rect class="hi" x="598" y="290" width="58" height="34" rx="4"/>
  <text class="small" x="627" y="312" text-anchor="middle">copy of 3</text>
  <text class="mono" x="598" y="340" text-anchor="middle">4</text>
  <path class="drop" d="M 239 292 L 269 322 M 269 292 L 239 322"/>
  <path class="relay" d="M 455 326 C 455 366, 225 366, 225 330"/>
  <polygon class="head" points="225.0,330.0 229.5,339.0 220.5,339.0"/>
  <text class="small" x="328" y="382" text-anchor="middle">PACKET 2 lost: frame 2 from the next one, 20 ms late</text>
  <path class="wire" d="M 30 406 L 190 406"/>
  <polygon class="head" points="196.0,406.0 187.0,410.5 187.0,401.5"/>
  <polygon class="head" points="24.0,406.0 33.0,401.5 33.0,410.5"/>
  <text class="small" x="110" y="422" text-anchor="middle">20 ms</text>
  <text class="small" x="400" y="422" text-anchor="middle">no PACKET more: the copies ride along, where both fit in a full frame's size</text>
  <text class="small" x="20" y="468" text-anchor="start">Under each PACKET its scheme, the upper half of its compression byte: 2 a frame of a group, 3 a repair, 4 a frame with a repair</text>
</svg>
