<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Forward error correction over time</title>
  <desc id="desc">A stream: frames 1 to 8 go as a group, frames 3 and 6 get lost; the group's three repairs follow in PACKETs of their own, spread out between the next group's frames, and undo the two lost frames.  Voice: one frame every 20 ms, each PACKET carrying a copy of the frame before; PACKET 2 is lost, and frame 2 comes out of PACKET 3.</desc>
