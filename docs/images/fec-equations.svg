<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Frames as unknowns, repairs as equations</title>
  <desc id="desc">Three frames, a = 5, b = 7 and c = 2, and two repairs, a + b + c = 14 and a + 2b + 3c = 25.  Frames b and c are lost; the receiver has a and both repairs, two equations for the two unknowns, and solves them: b + c = 9, 2b + 3c = 20, so c = 2 and b = 7.</desc>
