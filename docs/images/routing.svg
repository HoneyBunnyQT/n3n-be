  <rect class="nat" x="20" y="30" width="230" height="250" rx="12"/>
  <text class="small" x="32" y="48" text-anchor="start">home: 10.11.12.0/24</text>
  <path class="wire" d="M 75 100 L 75 238"/>
  <rect class="box" x="60" y="56" width="150" height="44" rx="8"/>
  <text class="title" x="135" y="76" text-anchor="middle">router</text>
  <text class="small" x="135" y="93" text-anchor="middle">.1 · to the internet</text>
  <rect class="hi" x="40" y="140" width="190" height="50" rx="8"/>
  <text class="title" x="135" y="163" text-anchor="middle">hickory</text>
  <text class="small" x="135" y="180" text-anchor="middle">eth0 .5 · n3n0 10.99.99.50</text>
  <rect class="opt" x="60" y="216" width="150" height="44" rx="8"/>
  <text class="title" x="135" y="236" text-anchor="middle">computers</text>
  <text class="small" x="135" y="253" text-anchor="middle">the rest of the LAN</text>
  <rect class="nat" x="470" y="30" width="230" height="250" rx="12"/>
  <text class="small" x="482" y="48" text-anchor="start">office: 192.168.1.0/24</text>
