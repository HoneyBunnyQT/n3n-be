  <text class="small" x="585" y="93" text-anchor="middle">.1 · to the internet</text>
  <rect class="hi" x="490" y="140" width="190" height="50" rx="8"/>
  <text class="title" x="585" y="163" text-anchor="middle">oscar</text>
  <text class="small" x="585" y="180" text-anchor="middle">eth0 .6 · n3n0 10.99.99.60</text>
  <rect class="opt" x="510" y="216" width="150" height="44" rx="8"/>
  <text class="title" x="585" y="236" text-anchor="middle">olivia</text>
