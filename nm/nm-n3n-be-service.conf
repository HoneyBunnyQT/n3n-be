<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- n3n-be for NetworkManager: its VPN service, which runs as root and
     which only NetworkManager (root) talks to, see nm/n3n-nm.h -->
<busconfig>
	<policy user="root">
		<allow own_prefix="org.freedesktop.NetworkManager.n3n-be"/>
		<allow send_destination="org.freedesktop.NetworkManager.n3n-be"/>
	</policy>
	<policy context="default">
		<deny own_prefix="org.freedesktop.NetworkManager.n3n-be"/>
		<deny send_destination="org.freedesktop.NetworkManager.n3n-be"/>
	</policy>
</busconfig>
