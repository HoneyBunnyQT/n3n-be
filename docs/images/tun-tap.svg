  <text class="title" x="530" y="22" text-anchor="middle">TUN: tuntap.type = tun</text>
  <rect class="box" x="390" y="36" width="280" height="40" rx="8"/>
  <text class="title" x="530" y="54" text-anchor="middle">the system</text>
  <text class="small" x="530" y="71" text-anchor="middle">applications, IP stack</text>
  <path class="wire" d="M 440 82 L 440 114"/>
  <polygon class="head" points="440.0,120.0 435.5,111.0 444.5,111.0"/>
  <polygon class="head" points="440.0,76.0 444.5,85.0 435.5,85.0"/>
  <text class="small" x="454" y="96" text-anchor="start">IP packets: IPv4, IPv6</text>
  <rect class="box" x="390" y="120" width="280" height="40" rx="8"/>
  <text class="title" x="530" y="145" text-anchor="middle">TUN device: utun3, tun0</text>
  <path class="wire" d="M 440 166 L 440 198"/>
  <polygon class="head" points="440.0,204.0 435.5,195.0 444.5,195.0"/>
  <polygon class="head" points="440.0,160.0 444.5,169.0 435.5,169.0"/>
  <text class="small" x="454" y="186" text-anchor="start">the same</text>
  <rect class="hi" x="390" y="204" width="280" height="58" rx="8"/>
  <text class="title" x="530" y="224" text-anchor="middle">edge</text>
  <text class="small" x="530" y="241" text-anchor="middle">puts the Ethernet header on and off,</text>
  <text class="small" x="530" y="255" text-anchor="middle">does ARP and neighbour discovery</text>
  <path class="wire" d="M 530 268 L 530 292"/>
  <polygon class="head" points="530.0,298.0 525.5,289.0 534.5,289.0"/>
