<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Hole punching through two NATs</title>
  <desc id="desc">Both edges register with the supernode, which tells each the public address of the other; both send REGISTERs to each other, which open their own NATs, and from then on they talk directly.</desc>
