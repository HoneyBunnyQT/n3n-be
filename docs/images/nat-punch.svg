  <path class="nat" d="M 70 62 L 70 100 M 70 118 L 70 154 M 70 172 L 70 244 M 70 276 L 70 316"/>
  <rect class="box" x="12" y="14" width="116" height="48" rx="8"/>
  <text class="title" x="70" y="36" text-anchor="middle">edge A</text>
  <text class="small" x="70" y="53" text-anchor="middle">10.0.0.1</text>
  <path class="nat" d="M 215 62 L 215 100 M 215 118 L 215 154 M 215 172 L 215 244 M 215 276 L 215 316"/>
  <rect class="opt" x="157" y="14" width="116" height="48" rx="8"/>
  <text class="title" x="215" y="36" text-anchor="middle">NAT A</text>
  <text class="small" x="215" y="53" text-anchor="middle">203.0.113.5</text>
  <path class="nat" d="M 360 62 L 360 100 M 360 118 L 360 154 M 360 172 L 360 244 M 360 276 L 360 316"/>
  <rect class="hi" x="302" y="14" width="116" height="48" rx="8"/>
  <text class="title" x="360" y="36" text-anchor="middle">supernode</text>
  <text class="small" x="360" y="53" text-anchor="middle"></text>
  <path class="nat" d="M 505 62 L 505 100 M 505 118 L 505 154 M 505 172 L 505 244 M 505 276 L 505 316"/>
  <rect class="opt" x="447" y="14" width="116" height="48" rx="8"/>
