  <polygon class="phead" points="490.0,165.0 481.0,169.5 481.0,160.5"/>
  <polygon class="phead" points="230.0,165.0 239.0,160.5 239.0,169.5"/>
  <text class="label" x="360" y="152" text-anchor="middle">community 10.99.99.0/24</text>
  <text class="mono" x="360" y="186" text-anchor="middle">filter.allow_routing = true</text>
  <text class="small" x="360" y="200" text-anchor="middle">and IP forwarding, at both</text>
  <text class="small" x="20" y="304" text-anchor="start">on hickory:</text>
  <text class="mono" x="20" y="320" text-anchor="start">ip route add 192.168.1.0/24 via 10.99.99.60</text>
  <text class="small" x="470" y="304" text-anchor="start">on the office router:</text>
