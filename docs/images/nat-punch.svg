  <polygon class="head" points="360.0,92.0 369.0,87.5 369.0,96.5"/>
  <text class="small" x="360" y="112" text-anchor="middle">1. Both register: the supernode sees each at its NAT's public address and port</text>
  <path class="wire" d="M 360 146 L 76 146"/>
  <polygon class="head" points="70.0,146.0 79.0,141.5 79.0,150.5"/>
  <path class="wire" d="M 360 146 L 644 146"/>
  <polygon class="head" points="650.0,146.0 641.0,150.5 641.0,141.5"/>
  <text class="mono" x="215" y="140" text-anchor="middle">B is at 198.51.100.7:40211</text>
  <text class="mono" x="505" y="140" text-anchor="middle">A is at 203.0.113.5:51000</text>
  <text class="small" x="360" y="166" text-anchor="middle">2. It tells each where the other one is</text>
  <path class="wire" d="M 70 200 L 495 200"/>
  <polygon class="head" points="501.0,200.0 492.0,204.5 492.0,195.5"/>
  <path class="drop" d="M 497 192 L 513 208 M 513 192 L 497 208"/>
  <text class="small" x="142.5" y="194" text-anchor="middle">REGISTER</text>
  <path class="wire" d="M 650 232 L 76 232"/>
  <polygon class="head" points="70.0,232.0 79.0,227.5 79.0,236.5"/>
  <text class="small" x="577.5" y="226" text-anchor="middle">REGISTER</text>
  <text class="small" x="360" y="254" text-anchor="middle">3. Each sends a REGISTER to the other, which opens its own NAT for the answer;</text>
  <text class="small" x="360" y="270" text-anchor="middle">the first may be dropped at the other NAT, the next finds it open</text>
  <path class="p2p" d="M 76 306 L 644 306"/>
  <polygon class="phead" points="650.0,306.0 641.0,310.5 641.0,301.5"/>
  <polygon class="phead" points="70.0,306.0 79.0,301.5 79.0,310.5"/>
  <text class="small" x="360" y="330" text-anchor="middle">4. Direct, both ways - the supernode is out of the way</text>
  <text class="small" x="360" y="362" text-anchor="middle">a NAT that changes the port for each destination needs more: see “Getting through a hard NAT”</text>
</svg>
