<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="title desc">
  <title id="title">TAP and TUN devices</title>
  <desc id="desc">A TAP device carries Ethernet frames between the system and the edge; a TUN device carries IP packets, and the edge adds the Ethernet header and answers ARP itself.  On the wire both are the same.</desc>
