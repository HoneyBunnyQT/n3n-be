---
name: netns

# On every push: all the netns scenarios (docs/develop/netns_testing.md) -
# edges and supernodes behind NATs of several kinds, failovers, outages,
# roaming, reloads, IPv6 - with a plain build, as it ships.  All but those
# tagged "limits", which fail on purpose, the interop ones, which
# interop.yml runs with the other versions built, and the cross ones, which
# the job "cross" runs.  The runners' kernel has IPv6, so no UML is needed
# here.

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netns:
    name: All scenarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          ./autogen.sh
          ./configure
          make build-dep
          ./configure --enable-pthread
          make -j4 all fuzz

      - name: netns scenarios
        run: |
          # a failed scenario runs once more: one that passes then is
          # FLAKY, an annotation on the run's page and a line in its
          # summary (which need the two variables), and keeps its logs
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_STEP_SUMMARY \
            python3 tests/netns/run.py --skip-missing -j 4 --retry 1

      - if: ${{ failure() || hashFiles('tests/netns/out/flaky.txt') != '' }}
        name: Upload the logs
        uses: actions/upload-artifact@v6
        with:
          name: netns
          path: tests/netns/out

  # The plugin of NetworkManager (nm/, docs/quick_start/GNOME.md): its
  # unit test, its settings page in GTK 4 and 3, and NetworkManager itself,
  # the runner's, with a D-Bus of its own in network namespaces
  # (tests/nm/netns.sh) - and with GNOME Shell on Xvfb, the extension in
  # it (tests/nm/shell.sh)
  networkmanager:
    name: NetworkManager plugin
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Build
        run: |
          sudo apt-get update
          # NetworkManager's package, not started on the runner: the test
          # starts one of its own
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get install -y network-manager dbus iproute2 xvfb \
            libnm-dev libnma-dev libnma-gtk4-dev libgtk-3-dev libgtk-4-dev \
            python3-gi gir1.2-nm-1.0 gir1.2-gtk-3.0 gir1.2-gtk-4.0
          sudo apt-get install -y --no-install-recommends gnome-shell \
            gnome-session-bin adwaita-icon-theme fonts-cantarell \
            dconf-service dconf-gsettings-backend
          ./autogen.sh
          ./configure --with-network-manager
          make -j4

      - name: Unit test
        run: |
          BINDIR=nm scripts/test_harness.sh tests/tests_nm.list

      - name: The settings page
        run: |
          xvfb-run -a python3 tests/nm/editor.py 4.0 nm tests/nm/edge.conf
          xvfb-run -a python3 tests/nm/editor.py 3.0 nm tests/nm/edge.conf

      - name: In NetworkManager, and the extension in GNOME Shell
        run: |
          sudo N3N_NM_HOLD=tests/nm/shell.sh tests/nm/netns.sh

  # The scenarios tagged "cross": an edge and a supernode of this tree
  # built for another CPU, under qemu-user, next to the host's - big
  # endian (s390x, mips) and ARM with its own versions of the ciphers
  cross:
    name: Across CPUs, under qemu
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Build this tree, for the host and the others
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 qemu-user \
            gcc-s390x-linux-gnu libc6-dev-s390x-cross \
            gcc-mips-linux-gnu libc6-dev-mips-cross \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          ./autogen.sh
          ./configure
          make build-dep
          make -j4 all
          tests/netns/versions.sh cross s390x s390x
          tests/netns/versions.sh cross mips mips
          tests/netns/versions.sh cross arm64 arm64 \
            "-march=armv8-a+crypto -DSPECK_ARM_NEON"

      - name: Cross scenarios
        run: |
          # a failed scenario once more, see above
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_STEP_SUMMARY \
            python3 tests/netns/run.py -j 4 --retry 1 @cross

      - if: ${{ failure() || hashFiles('tests/netns/out/flaky.txt') != '' }}
        name: Upload the logs
        uses: actions/upload-artifact@v6
        with:
          name: netns-cross
          path: tests/netns/out
