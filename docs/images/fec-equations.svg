  <text class="title" x="20" y="24" text-anchor="start">Frames as unknowns, repairs as equations</text>
  <text class="small" x="20" y="52" text-anchor="start">sent: a group of three frames, and two repairs made of them</text>
  <rect class="box" x="40" y="70" width="100" height="50" rx="8"/>
  <text class="title" x="90" y="93" text-anchor="middle">frame a</text>
  <text class="small" x="90" y="110" text-anchor="middle">5</text>
  <rect class="opt" x="150" y="70" width="100" height="50" rx="8"/>
  <text class="title" x="200" y="93" text-anchor="middle">frame b</text>
  <text class="small" x="200" y="110" text-anchor="middle">7</text>
  <rect class="opt" x="260" y="70" width="100" height="50" rx="8"/>
  <text class="title" x="310" y="93" text-anchor="middle">frame c</text>
  <text class="small" x="310" y="110" text-anchor="middle">2</text>
  <rect class="hi" x="390" y="70" width="150" height="50" rx="8"/>
  <text class="title" x="465" y="93" text-anchor="middle">repair 1</text>
  <text class="small" x="465" y="110" text-anchor="middle">a + b + c = 14</text>
  <rect class="hi" x="550" y="70" width="150" height="50" rx="8"/>
  <text class="title" x="625" y="93" text-anchor="middle">repair 2</text>
  <text class="small" x="625" y="110" text-anchor="middle">a + 2b + 3c = 25</text>
  <path class="drop" d="M 241 61 L 259 79 M 259 61 L 241 79"/>
  <text class="small" x="200" y="136" text-anchor="middle">lost</text>
  <path class="drop" d="M 351 61 L 369 79 M 369 61 L 351 79"/>
  <text class="small" x="310" y="136" text-anchor="middle">lost</text>
  <path class="wire" d="M 90 122 L 90 154"/>
  <polygon class="head" points="90.0,160.0 85.5,151.0 94.5,151.0"/>
  <path class="wire" d="M 465 122 L 465 154"/>
  <polygon class="head" points="465.0,160.0 460.5,151.0 469.5,151.0"/>
  <path class="wire" d="M 625 122 L 625 154"/>
  <polygon class="head" points="625.0,160.0 620.5,151.0 629.5,151.0"/>
  <rect class="box" x="40" y="162" width="640" height="118" rx="8"/>
  <text class="small" x="60" y="184" text-anchor="start">received: a = 5, repair 1 = 14, repair 2 = 25 - two unknowns, b and c, and two equations:</text>
  <text class="label" x="80" y="212" text-anchor="start">b + c = 14 − 5 = 9</text>
  <text class="label" x="80" y="234" text-anchor="start">2b + 3c = 25 − 5 = 20</text>
  <text class="label" x="80" y="256" text-anchor="start">so c = 20 − 2 × 9 = 2, and b = 9 − 2 = 7</text>
  <text class="small" x="360" y="302" text-anchor="middle">any 2 of these 5 may get lost: what is left always holds as many equations as frames are missing</text>
  <text class="small" x="360" y="318" text-anchor="middle">n3n does this for each byte of the frames, in an arithmetic of bytes, GF(2^8), instead of ordinary numbers</text>
</svg>
